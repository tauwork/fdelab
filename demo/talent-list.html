<style>
  :root {
    --ink: #17241e;
    --muted: #5e6a63;
    --paper: #f4f1ea;
    --card: #fffdf8;
    --line: #e3dccf;
    --accent: #1f6b4a;
    --gold: #c4a574;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .wrap { position: relative; z-index: 1; padding: 34px 6vw 90px; max-width: 1320px; margin: 0 auto; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 34px; }
  .brand { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 22px; letter-spacing: .05em; }
  .breadcrumb { font-size: 12.5px; color: var(--muted); letter-spacing: .06em; }

  header.head { margin-bottom: 30px; }
  .kicker { font-size: 11px; letter-spacing: .26em; color: var(--gold); margin: 0 0 12px; }
  h1 { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 54px; font-weight: 500; margin: 0; letter-spacing: .01em; line-height: 1.1; }
  .lead { margin: 14px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.75; max-width: 660px; }
  .stats { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); letter-spacing: .06em; flex-wrap: wrap; }
  .stats b { font-size: 12px; color: var(--ink); font-weight: 500; margin-right: 3px; font-variant-numeric: tabular-nums; }
  .stats .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: .6; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; justify-content: space-between;
    margin: 36px 0 28px; padding-bottom: 0; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 20px; }
  .tab {
    position: relative; border: 0; background: none; padding: 0 0 14px;
    font-family: inherit; font-size: 13px; color: var(--muted); cursor: pointer;
    letter-spacing: .02em; transition: color .2s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .right { display: flex; gap: 18px; align-items: center; padding-bottom: 10px; }

  .pick { position: relative; }
  .pick-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: none; padding: 5px 0; font-family: inherit;
    font-size: 12.5px; color: var(--muted); cursor: pointer; letter-spacing: .02em;
    transition: color .2s ease;
  }
  .pick-btn:hover, .pick.open .pick-btn { color: var(--ink); }
  .pick.picked .pick-btn { color: var(--accent); }
  .chev {
    width: 6px; height: 6px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor;
    transform: rotate(45deg) translate(-1px, -1px); opacity: .65;
    transition: transform .22s ease, opacity .22s ease;
  }
  .pick.open .chev { transform: rotate(-135deg) translate(-1px, -1px); opacity: 1; }
  .pick-panel {
    position: absolute; right: 0; top: calc(100% + 9px); min-width: 208px;
    background: #fffdf8; border: 1px solid rgba(227,220,207,.9); border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 20px 42px -24px rgba(23,36,30,.45);
    padding: 7px; z-index: 30; display: none;
  }
  .pick.open .pick-panel { display: block; animation: pickIn .18s ease-out both; }
  @keyframes pickIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pick.open .pick-panel { animation: none; } }
  .pick-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 0; background: none; text-align: left; font-family: inherit;
    font-size: 12.5px; color: #4c574f; padding: 7px 9px 7px 7px; border-radius: 7px; cursor: pointer;
    transition: background .14s ease, color .14s ease;
  }
  .pick-item:hover { background: rgba(31,107,74,.07); color: var(--ink); }
  .pick-item .tick { width: 4px; height: 4px; border-radius: 50%; background: transparent; flex-shrink: 0; }
  .pick-item.on { color: var(--ink); }
  .pick-item.on .tick { background: var(--gold); }

  input.search {
    border: 0; border-bottom: 1px solid var(--line); background: transparent; border-radius: 0;
    padding: 5px 2px; font-size: 12.5px; width: 150px; color: var(--ink); font-family: inherit;
    outline: none; transition: border-color .2s ease;
  }
  input.search::placeholder { color: #a8b0aa; }
  input.search:focus { border-color: var(--accent); }
  .count { font-size: 11.5px; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px 28px; perspective: 1400px; }

  .card {
    position: relative; display: flex; flex-direction: column; height: 100%;
    transform-style: preserve-3d; will-change: transform;
    background-color: #fffdf8;
    background-image:
      radial-gradient(ellipse 64% 50% at 18% 8%, rgba(31,107,74,.075), transparent 62%),
      radial-gradient(ellipse 58% 46% at 90% 92%, rgba(196,165,116,.15), transparent 62%),
      linear-gradient(168deg, #fffdf8, #fcf8f0);
    border: 0; border-radius: 12px;
    padding: 26px 26px 20px; cursor: pointer;
    box-shadow:
      0 1px 2px rgba(23,36,30,.05),
      0 16px 34px -26px rgba(23,36,30,.30),
      0 1px 0 rgba(255,255,255,.9) inset;
    transition: box-shadow .35s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(31,107,74,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,107,74,.045) 1px, transparent 1px);
    background-size: 24px 24px; background-position: center;
    -webkit-mask-image: radial-gradient(ellipse 88% 74% at 50% 36%, #000 10%, transparent 78%);
    mask-image: radial-gradient(ellipse 88% 74% at 50% 36%, #000 10%, transparent 78%);
  }
  .card > *:not(.shine) { position: relative; z-index: 1; }
  .card .shine {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    transform: translateZ(48px) scale(.95);
    background: radial-gradient(circle 150px at var(--mx, 50%) var(--my, 40%),
      rgba(255,255,255,.85) 0%, rgba(196,165,116,.62) 22%, transparent 62%);
    mix-blend-mode: soft-light; opacity: 0; transition: opacity .4s ease;
  }
  .card:hover .shine { opacity: .9; }
  .card:hover {
    box-shadow:
      0 1px 2px rgba(23,36,30,.06),
      0 28px 50px -30px rgba(23,36,30,.40),
      0 1px 0 rgba(255,255,255,.9) inset;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; transform: translateZ(18px); }
  .mark { font-size: 9.5px; letter-spacing: .24em; color: var(--gold); }
  .city { font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }

  .name {
    transform: translateZ(26px);
    font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
    font-size: 29px; font-weight: 500; margin: 18px 0 6px; letter-spacing: .02em; line-height: 1.15;
  }
  .role { transform: translateZ(22px); font-size: 12.5px; color: var(--accent); line-height: 1.55; min-height: 20px; }

  .meta { transform: translateZ(16px); margin-top: 14px; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .meta b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tags { transform: translateZ(14px); margin-top: 8px; font-size: 11.5px; color: #6d786f; line-height: 1.7; }
  .dotsep { color: var(--gold); margin: 0 6px; opacity: .75; }
  .tags .dm { color: #8a7a5e; }

  .case {
    transform: translateZ(8px);
    margin-top: 20px; padding-left: 14px; border-left: 2px solid rgba(31,107,74,.3);
  }
  .case .clabel { font-size: 9.5px; color: var(--gold); letter-spacing: .2em; }
  .case .ctitle {
    font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
    font-size: 15px; line-height: 1.6; margin-top: 7px; color: var(--ink);
  }
  .case .cbudget { font-size: 11.5px; color: var(--muted); margin-top: 7px; letter-spacing: .02em; }
  .case.empty { border-left-color: rgba(196,165,116,.45); color: var(--muted); font-size: 12px; line-height: 1.7; }

  .foot { transform: translateZ(12px); display: flex; gap: 18px; align-items: center; margin-top: auto; padding-top: 24px; }
  .btn {
    border: 0; background: none; padding: 0; color: var(--muted);
    font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: .02em;
    transition: color .18s ease;
  }
  .btn:hover { color: var(--accent); }
  .btn.solid { color: var(--accent); font-weight: 500; }
  .btn.solid:hover { color: #164b34; }
  .btn.solid:hover { background: #1a5b3f; color: #fff; }
  .foot .like { margin-left: auto; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

  .drawer-mask {
    position: fixed; inset: 0; background: rgba(23,36,30,.34); backdrop-filter: blur(3px);
    display: none; z-index: 40; align-items: stretch; justify-content: flex-end;
  }
  .drawer-mask.open { display: flex; }
  .drawer {
    width: min(520px, 100%); background: var(--paper); height: 100%; overflow-y: auto;
    padding: 30px 32px 60px; box-shadow: -30px 0 60px -30px rgba(0,0,0,.4);
    transform: translateX(24px); opacity: 0; transition: all .26s ease;
  }
  .drawer-mask.open .drawer { transform: none; opacity: 1; }
  .drawer .close { float: right; border: 0; background: transparent; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; }
  .drawer .drole { font-size: 13px; color: var(--accent); margin-top: 4px; }
  .drawer h2 { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 34px; font-weight: 500; margin: 6px 0 0; }
  .dsec { margin-top: 26px; }
  .dsec h3 { font-size: 12px; letter-spacing: .12em; color: var(--gold); margin: 0 0 10px; font-weight: 500; }
  .dsec p { margin: 0 0 8px; font-size: 13.2px; line-height: 1.75; color: #2c3731; }
  .dsec p b { font-weight: 500; }
  .dcase { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); margin-bottom: 10px; }
  .dcase .ind { font-size: 11px; color: var(--accent); }
  .dcase h4 { margin: 4px 0 6px; font-size: 14.5px; font-weight: 500; }
  .dcase ul { margin: 6px 0 0; padding-left: 16px; font-size: 12.6px; color: #46524c; line-height: 1.7; }
  .dcase .meta { margin-top: 8px; font-size: 11.8px; color: var(--muted); }
  .drawer .cta { margin-top: 26px; display: flex; gap: 10px; }
  .drawer .cta .btn { border: 1px solid var(--line); padding: 8px 15px; border-radius: 999px; color: var(--ink); }
  .drawer .cta .btn:hover { border-color: var(--accent); color: var(--accent); }
  .drawer .cta .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .drawer .cta .btn.solid:hover { background: #164b34; color: #fff; }
  .dsec .tag {
    display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 4px 10px;
    border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.55); margin-right: 6px;
  }
  .dsec .tag.domain { border-style: dashed; color: #7a6a4f; border-color: #e0d3ba; }

  @media (max-width: 640px) {
    h1 { font-size: 38px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .tabs { gap: 16px; }
    .right { width: 100%; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; }
    .pick-panel { right: auto; left: 0; }
    input.search { width: 100%; }
    .card { padding: 22px 20px 18px; }
    .name { font-size: 25px; }
  }
</style>
</head>

    industries: ["离散制造", "消费品零售"],
    domains: ["ERP / MES 实施", "数据治理"],
    roles: [["某 ERP 服务商", "实施总监", "制造业客户交付"]],
    experiences: [["实施交付", "主导过 20+ 家汽配、家电厂的 ERP 上线"]],
    services: [["存量系统体检", "两周出一份「哪些能复用、哪些必须换」的判断"]],
    collabs: [["寻找需要体检的工厂", "先做诊断，再谈方案"]],
    cases: [
      {
        industry: "离散制造 · 系统实施",
        title: "汽配厂 MES 上线：先补数据，再谈智能",

        budget: "约 60 万", duration: "4 个月",
        points: ["先把工单与报工数据打通", "再上异常闭环与看板"],
        delivery: "报工及时率从 60% 提升到 92%",
        pitfall: "跳过数据治理直接上 MES，返工率极高"
      }
    ]
  },
  {
    name: "徐永强", slug: "xuyongqiang", city: "深圳", likes: 0,
    role: "资深 IT 从业人士",
    industries: ["企业服务"],
    domains: ["IT 架构"],
    roles: [["待补充", "—", "档案整理中"]],
    experiences: [],
    services: [],
    collabs: [],
    cases: []
  }
];

let filterIndustry = null, filterDomain = null, sortKey = "likes", keyword = "";

const el = {
  grid: document.getElementById("grid"),
  empty: document.getElementById("empty"),
  mask: document.getElementById("mask"),
  drawer: document.getElementById("drawer"),
  sPeople: document.getElementById("s-people"),
  sInd: document.getElementById("s-ind"),
  sCase: document.getElementById("s-case"),
  industryTabs: document.getElementById("industryTabs"),
  count: document.getElementById("count"),
  search: document.getElementById("search")
};

function caseCount(p) { return p.cases.length; }

function industryOptions() {
  const s = new Set();
  people.forEach(p => p.industries.forEach(i => s.add(i)));
  return [...s];
}
function domainOptions() {
  const s = new Set();
  people.forEach(p => p.domains.forEach(i => s.add(i)));
  return [...s];
}

function closePickers() {
  document.querySelectorAll(".pick.open").forEach(p => {
    p.classList.remove("open");
    const b = p.querySelector(".pick-btn");
    if (b) b.setAttribute("aria-expanded", "false");
  });
}
document.addEventListener("click", closePickers);

function makePicker(id, items, getValue, onPick, prefix) {
  const root = document.getElementById(id);
  const btn = root.querySelector(".pick-btn");
  const label = root.querySelector(".pick-label");
  const panel = root.querySelector(".pick-panel");

  function paintPanel() {
    const cur = getValue() == null ? "" : String(getValue());
    panel.innerHTML = items().map(o =>
      '<button class="pick-item' + (String(o.v) === cur ? " on" : "") +
      '" type="button" role="option" data-v="' + o.v + '"><i class="tick"></i><span>' + o.label + "</span></button>"
    ).join("");
  }
  function paintLabel() {
    const list = items();
    const cur = getValue() == null ? "" : String(getValue());
    const hit = list.find(o => String(o.v) === cur);
    label.textContent = prefix
      ? (cur && hit ? prefix + " · " + hit.label : prefix)
      : (hit ? hit.label : list[0].label);
  }
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = root.classList.contains("open");
    closePickers();
    if (wasOpen) return;
    paintPanel();
    root.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
  });
  panel.addEventListener("click", e => {
    const it = e.target.closest(".pick-item");
    if (!it) return;
    closePickers();
    onPick(it.dataset.v);
  });
  return { sync: paintLabel };
}

function renderFilters() {
  const opts = [{ v: null, label: "全部" }, ...industryOptions().map(o => ({ v: o, label: o }))];
  el.industryTabs.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (filterIndustry === o.v ? " on" : "");
    b.textContent = o.label;
    b.onclick = () => { filterIndustry = o.v; render(); };
    el.industryTabs.appendChild(b);
  });

  domainPicker.sync();
}

function renderStats() {
  el.sPeople.textContent = people.length;
  el.sInd.textContent = industryOptions().length;
  el.sCase.textContent = people.reduce((n, p) => n + caseCount(p), 0);
}

function visiblePeople() {
  const kw = keyword.trim().toLowerCase();
  return people
    .filter(p => !filterIndustry || p.industries.includes(filterIndustry))
    .filter(p => !filterDomain || p.domains.includes(filterDomain))
    .filter(p => !kw || p.name.toLowerCase().includes(kw) ||
      p.role.toLowerCase().includes(kw) ||
      p.industries.concat(p.domains).some(t => t.toLowerCase().includes(kw)))
    .sort((a, b) => sortKey === "cases"
      ? caseCount(b) - caseCount(a) || b.likes - a.likes
      : b.likes - a.likes || caseCount(b) - caseCount(a));
}

function render() {
  renderFilters();
  const list = visiblePeople();
  el.grid.innerHTML = "";
  el.empty.style.display = list.length ? "none" : "block";
  el.count.textContent = list.length + " / " + people.length + " 位";

  list.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    const tags = [
      ...p.industries.slice(0, 2).map(t => "<span>" + t + "</span>"),
      ...p.domains.slice(0, 1).map(t => '<span class="dm">' + t + "</span>")
    ].join('<span class="dotsep">·</span>');

    const first = p.cases[0];
    const caseBlock = first
      ? '<div class="case"><div class="clabel">代表案例</div><div class="ctitle">' + first.title +
        '</div><div class="cbudget">' + first.budget + " · " + first.duration + "</div></div>"
      : '<div class="case empty">暂无案例，档案整理中——不编数据</div>';

    card.innerHTML =
      '<div class="shine" aria-hidden="true"></div>' +
      '<div class="card-top"><span class="mark">FDE · IDENTITY</span><span class="city">' + p.city + "</span></div>" +
      '<h2 class="name">' + p.name + "</h2>" +
      '<div class="role">' + p.role + "</div>" +
      '<div class="meta"><b>' + caseCount(p) + '</b> 个案例<span class="dotsep">·</span><b>' +
        p.industries.length + '</b> 个行业<span class="dotsep">·</span><b>' + p.likes + "</b> 赞</div>" +
      '<div class="tags">' + tags + "</div>" +
      caseBlock +
      '<div class="foot">' +
        '<button class="btn" type="button" data-preview="1">预览档案</button>' +
        '<a class="btn solid" href="' + HOST + "/t/" + p.slug + '" target="_blank" rel="noopener" data-go="1">进入主页 →</a>' +
      "</div>";

    card.addEventListener("click", e => {
      if (e.target.closest("[data-preview]")) { e.stopPropagation(); openDrawer(p); return; }
      if (e.target.closest("[data-go]")) return;
      window.open(HOST + "/t/" + p.slug, "_blank");
    });

    el.grid.appendChild(card);
  });
}

function openDrawer(p) {
  const sec = (title, html) => html ? '<section class="dsec"><h3>' + title + "</h3>" + html + "</section>" : "";

  const rolesHtml = p.roles.length
    ? p.roles.map(r => "<p><b>" + r[0] + "</b> · " + r[1] + "<br>" + r[2] + "</p>").join("")
    : "<p>待补充</p>";
  const expHtml = p.experiences.length
    ? p.experiences.map(r => "<p><b>" + r[0] + "</b><br>" + r[1] + "</p>").join("")
    : "";
  const svcHtml = p.services.length
    ? p.services.map((r, i) => "<p><b>0" + (i + 1) + "　" + r[0] + "</b><br>" + r[1] + "</p>").join("")
    : "";
  const collabHtml = p.collabs.length
    ? p.collabs.map(r => "<p><b>" + r[0] + "</b><br>" + r[1] + "</p>").join("")
    : "";
  const casesHtml = p.cases.length
    ? p.cases.map(c =>
        '<div class="dcase"><div class="ind">' + c.industry + "</div><h4>" + c.title + "</h4>" +
        "<p style=\"font-size:12.6px;color:#5e6a63;margin:0\">" + c.portrait + "</p>" +
        "<ul>" + c.points.map(x => "<li>" + x + "</li>").join("") + "</ul>" +
        '<div class="meta">投入 ' + c.budget + " · 周期 " + c.duration + " · 交付 " + c.delivery + "</div>" +
        '<div class="meta" style="color:#8a5a2a">坑 · ' + c.pitfall + "</div></div>"
      ).join("")
    : '<p style="color:#5e6a63">暂无案例。这位的档案还在整理，宁缺不编。</p>';

  el.drawer.innerHTML =
    '<button class="close" type="button" id="closeDrawer">✕</button>' +
    '<p class="kicker" style="margin:0;font-size:11px;letter-spacing:.2em;color:#c4a574">FDE · PROFILE</p>' +
    "<h2>" + p.name + "</h2>" +
    '<p class="drole">' + p.role + "　·　" + p.city + "</p>" +
    '<div class="tags" style="margin-top:14px">' +
      p.industries.map(t => '<span class="tag">' + t + "</span>").join("") +
      p.domains.map(t => '<span class="tag domain">' + t + "</span>").join("") +
    "</div>" +
    sec("交付数据", "<p><b>" + caseCount(p) + " 个案例</b> · 覆盖 " + p.industries.length + " 个行业 · " + p.likes + " 个赞</p>") +
    sec("主要身份", rolesHtml) + sec("过往经历", expHtml) +
    sec("提供的服务", svcHtml) + sec("正在寻找的合作", collabHtml) +
    sec("实战案例", casesHtml) +
    '<div class="cta"><a class="btn solid" href="' + HOST + "/t/" + p.slug + '" target="_blank" rel="noopener">进入完整主页 →</a>' +
    '<button class="btn" type="button" id="closeDrawer2">关闭</button></div>';

  el.mask.classList.add("open");
  el.drawer.scrollTop = 0;
  document.getElementById("closeDrawer").onclick = closeDrawer;
  document.getElementById("closeDrawer2").onclick = closeDrawer;
}

function closeDrawer() { el.mask.classList.remove("open"); }
el.mask.addEventListener("click", e => { if (e.target === el.mask) closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closePickers(); } });

let t;
el.search.addEventListener("input", e => {
  clearTimeout(t);
  t = setTimeout(() => { keyword = e.target.value; render(); }, 140);
});

const domainPicker = makePicker(
  "domainPick",
  () => [{ v: "", label: "全部" }, ...domainOptions().map(o => ({ v: o, label: o }))],
  () => filterDomain || "",
  v => { filterDomain = v || null; render(); },
  "能力域"
);

const sortPicker = makePicker(
  "sortPick",
  () => [{ v: "likes", label: "按点赞" }, { v: "cases", label: "按案例数" }],
  () => sortKey,
  v => { sortKey = v; render(); },
  null
);

renderStats();
render();

const MAX_TY = 9, MAX_TX = 7;
const tilts = new WeakMap();
let rafTilt = 0;

function tiltOf(card) {
  let s = tilts.get(card);
  if (!s) { s = { rx: 0, ry: 0, trx: 0, tRy: 0, s: 1, ts: 1 }; tilts.set(card, s); }
  return s;
}
function tiltLoop() {
  let active = false;
  el.grid.querySelectorAll(".card").forEach(card => {
    const s = tilts.get(card);
    if (!s) return;
    if (Math.abs(s.trx - s.rx) < .01 && Math.abs(s.tRy - s.ry) < .01 && Math.abs(s.ts - s.s) < .0005) return;
    s.rx += (s.trx - s.rx) * .09;
    s.ry += (s.tRy - s.ry) * .09;
    s.s += (s.ts - s.s) * .12;
    card.style.transform = "rotateX(" + s.rx.toFixed(2) + "deg) rotateY(" + s.ry.toFixed(2) + "deg) scale(" + s.s.toFixed(4) + ")";
    active = true;
  });
  rafTilt = active ? requestAnimationFrame(tiltLoop) : 0;
}
function kickTilt() { if (!rafTilt) rafTilt = requestAnimationFrame(tiltLoop); }

el.grid.addEventListener("pointermove", e => {
  if (reduce) return;
  const card = e.target.closest(".card");
  if (!card) return;
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width;
  const py = (e.clientY - r.top) / r.height;
  const s = tiltOf(card);
  s.tRy = (px - .5) * MAX_TY * 2;
  s.trx = (.5 - py) * MAX_TX * 2;
  s.ts = 1.012;
  card.style.setProperty("--mx", (px * 100).toFixed(2) + "%");
  card.style.setProperty("--my", (py * 100).toFixed(2) + "%");
  kickTilt();
});
el.grid.addEventListener("pointerout", e => {
  if (reduce) return;
  const card = e.target.closest(".card");
  if (!card || card.contains(e.relatedTarget)) return;
  const s = tiltOf(card);
  s.trx = 0; s.tRy = 0; s.ts = 1;
  card.style.setProperty("--mx", "50%");
  card.style.setProperty("--my", "40%");
  kickTilt();
});

const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dots = [], mouse = { x: -999, y: -999 };
const DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  const n = Math.round(Math.min(80, (innerWidth * innerHeight) / 26000));
  dots = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .18 * DPR, vy: (Math.random() - .5) * .18 * DPR,
    r: (Math.random() * 1.4 + .6) * DPR
  }));
}
resize();
addEventListener("resize", resize);
addEventListener("pointermove", e => { mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR; });

function frame() {
  ctx.clearRect(0, 0, W, H);
  const link = 120 * DPR;
  for (let i = 0; i < dots.length; i++) {
    const p = dots[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
    if (d < 140 * DPR) { p.x += (dx / d) * .5; p.y += (dy / d) * .5; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(31,107,74,.22)"; ctx.fill();
    for (let j = i + 1; j < dots.length; j++) {
      const q = dots[j], dd = Math.hypot(p.x - q.x, p.y - q.y);
      if (dd < link) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
        ctx.strokeStyle = "rgba(31,107,74," + (0.13 * (1 - dd / link)).toFixed(3) + ")";
        ctx.lineWidth = .6 * DPR; ctx.stroke();
      }
    }
  }
  requestAnimationFrame(frame);
}
if (!reduce) frame();
