services:
  mysql:
    image: mysql:8.4
    container_name: fdelab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fdelab
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - fdelab-mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/talent.sql:/docker-entrypoint-initdb.d/02-talent.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build: ./fdelab-server
    container_name: fdelab-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  admin-web:
    build: ./fdelab-admin-web
    container_name: fdelab-admin-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server

  site-web:
    build: ./fdelab-site-web
    container_name: fdelab-site-web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - server

volumes:
  fdelab-mysql:
